# 서비스 정의
# backend(Django), postgres(PostgreSQL), redis, nginx, frontend(Expo)
services:
  ###################################
  # BACKEND: Django REST API
  ###################################
  backend:
    # back-end 폴더의 Dockerfile로 이미지 빌드
    build: ./back-end

    container_name: yunissaem-backend

    # 로컬 소스코드를 컨테이너 /app에 마운트
    # static/media는 볼륨으로 분리
    volumes:
      - ./back-end:/app
      - static_volume:/app/static
      - media_volume:/app/media

    # 내부 8000 포트를 호스트 8000으로 노출
    ports:
      - "8000:8000"
    expose:
      - 8000

    # postgres/redis가 먼저 뜨도록 의존성 설정
    depends_on:
      - postgres
      - redis

    # Django 및 DB/Redis 연결 환경변수
    environment:
      DJANGO_SETTINGS_MODULE: yunissaem_api.settings

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - yuninet

  ###################################
  # PostgreSQL
  ###################################
  postgres:
    image: postgres:15
    container_name: yunissaem-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - yuninet

  ###################################
  # Redis: 캐시/세션/채팅용
  ###################################
  redis:
    image: redis:7
    container_name: yunissaem-redis
    ports:
      - "6379:6379"
    networks:
      - yuninet

  ###################################
  # NGINX: Reverse Proxy
  ###################################
  nginx:
    container_name: yunissaem-nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - yuninet

  # FRONTEND: React Native / Expo
  frontend:
    build: ./my-app
    volumes:
      - ./my-app:/app
      - /app/node_modules
    ports:
      - "19000:19000"   # Expo Metro
      - "19001:19001"   # Expo DevTools
      - "19006:19006"   # Expo Web
      - "8081:8081"     # Metro fallback
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - HOST=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${PC_IP:-localhost}
    stdin_open: true
    tty: true
    networks:
      - yuninet

# Docker named volume 정의
volumes:
  pgdata:
  static_volume:
  media_volume:

networks:
  yuninet:
